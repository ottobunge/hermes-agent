name: wakeword_bridge
version: 0.1.0
kind: standalone
description: >-
  HTTP bridge between the hermes-wake-word daemon (running on minipc) and the
  canonical session-event seam in the gateway. Receives OGG/Opus audio bytes
  + a canonical <gateway_id>/<session_key> target, validates HMAC, caches
  the audio via cache_audio_from_bytes, builds a MessageEvent of type
  MessageType.VOICE, and enqueues it via GatewayRunner.enqueue_internal_session_event.
  The wake-word daemon's sendVoice-to-Telegram path is replaced with a POST here.

  Single model tool: none.
  Hooks: on_gateway_start (kicks up an aiohttp server on 127.0.0.1:8645).
  Configuration: ~/.config/hermes/wakeword_hmac (file with shared secret).
hooks:
  - on_gateway_start
  - on_gateway_stop
